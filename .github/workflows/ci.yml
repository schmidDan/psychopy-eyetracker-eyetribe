name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: isort
        run: isort --check-only .
      - name: Mypy (PsychoPy-free core)
        run: mypy
      - name: Pytest
        run: pytest -m "not hardware" -q --cov=psychopy_eyetracker_eyetribe.eyetribe.eyetribe_client --cov=psychopy_eyetracker_eyetribe.mock.mock_server --cov-report=term-missing --cov-fail-under=90
