name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: isort
        run: isort --check-only .
      - name: Pytest
        run: pytest -m "not hardware" -q
      # Phase 1+ adds: mypy (strict, PsychoPy-free core) and a >=90% core coverage gate.
      # See docs/DEVELOPMENT_PLAN.md section 6.
