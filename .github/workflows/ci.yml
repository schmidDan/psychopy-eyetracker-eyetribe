name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: isort
        run: isort --check-only .
      - name: Mypy (PsychoPy-free core)
        run: mypy
      - name: Pytest
        run: pytest -m "not hardware" -q --cov=psychopy_eyetracker_eyetribe.eyetribe.eyetribe_client --cov=psychopy_eyetracker_eyetribe.mock.mock_server --cov-report=term-missing --cov-fail-under=90

  wheel-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel into clean env (no source tree)
        run: pip install pyyaml pytest dist/*.whl
      - name: Smoke-test — entry points, YAML, settings backend
        run: pytest tests/integration/test_discovery.py -q -k "not integration"
